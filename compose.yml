services:
  web:
    image: caddy:2
    profiles:
      - proxy
    #environment:
    # 検証用。本番環境のLet's Encryptを実行すると526エラーで1時間待たされることがあるため。
    #  ACME_CA: "https://acme-staging-v02.api.letsencrypt.org/directory"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # QUIC/HTTP3用
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - internal_network

  mi:
    image: misskey/misskey:2025.12.2
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      - db
      - redis
    volumes:
      - ./misskey/config.yml:/misskey/.config/default.yml:ro
      - ./files:/misskey/files
    restart: unless-stopped
    networks:
      - internal_network

  db:
    image: groonga/pgroonga:4.0.5-alpine-18
    #共有メモリ不足でVacuumの失敗を防止する。チューニングと合わせて変更すること。
    shm_size: "512m"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgresql/db-init.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - internal_network

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}",]
    volumes:
      - redis-data:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20
    networks:
      - internal_network

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  internal_network:
